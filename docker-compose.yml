services:
  web:
    build: .
    container_name: wallps_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3

    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn wallpsite.wsgi:application --bind 0.0.0.0:8000 --workers 2"