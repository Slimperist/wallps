{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
   <a href="{% url 'home' %}" class="navbar-brand"><img src="{% static 'img/logo.png' %}" alt="" class="d-inline-block align-middle mr-2"></a>
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarColor01" aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="navbarColor01">
      <ul class="navbar-nav mr-auto">
        <li class="nav-item"><a class="nav-link" href="#" data-toggle="modal" data-target="#myModal">Список категорий</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'tag_list' %}">Список Тэгов</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'random_wallps' %}">Случайные 50</a></li>
        <li class="nav-item">
          <form class="form-inline mr-auto"  action="{% url 'search' %}" method="get">
            <input class="form-control mr-sm-2" type="search" name="s" placeholder="Поиск...">
            <button class="btn btn-outline-info my-2 my-sm-0 bg-dark text-light border-0" type="submit">Найти</button>
          </form>
        </li>
      </ul>
    </div>
  </nav>

{% load wallps_tags %}
{% get_categories as all_cat %}

<!-- Модальное окно -->
<div class="modal fade" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content bg-dark">
      <div class="modal-body bg-dark">
        <div class="row">
          <p>
            {% for cat in all_cat %}
             <div class="col-4 navbar-dark justify-content-between"><span class="navbar-text">
                  <a href="{{ cat.get_absolute_url }}">{{ cat.name_category_ru }}
                    <span class="badge badge-light">{{ cat.wallpapers__count }}</span>
                  </a></span>
             </div>
            {% endfor %}
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
